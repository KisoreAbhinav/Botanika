[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botanika"
version = "0.1.0"
description = "Botanika Raspberry Pi connectivity and botanical intelligence backend"
requires-python = ">=3.11"
dependencies = [
    # Keep the Starlette/httpx test-client contract stable on the Pi image.
    "fastapi>=0.115,<0.120",
    "Pillow>=10,<13",
    "PyJWT[crypto]>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
